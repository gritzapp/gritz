name: Diagrams Preview

# Publishes the Motion Canvas diagrams of a PR to gh-pages:/pr/<number>/,
# keeps one PR comment pointing at it, and removes it when the PR closes.

on:
  pull_request:
    types: [ opened, reopened, synchronize, closed ]
    paths:
      - 'diagrams/**'
      - '.github/workflows/diagrams-preview.yml'

permissions:
  contents: write
  pages: read
  pull-requests: write

# Shared by every workflow that pushes to gh-pages.
concurrency:
  group: gh-pages
  cancel-in-progress: false

env:
  PREVIEW_DIR: pr/${{ github.event.pull_request.number }}

jobs:
  preview:
    # Fork PRs get a read-only token and cannot push to gh-pages.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        if: github.event.action != 'closed'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.0

      - name: Set up Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: diagrams/pnpm-lock.yaml

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: pnpm install --frozen-lockfile
        working-directory: diagrams

      - name: Build
        if: github.event.action != 'closed'
        run: pnpm run build
        working-directory: diagrams

      - name: Deploy preview
        if: github.event.action != 'closed'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: diagrams/dist
          target-folder: ${{ env.PREVIEW_DIR }}
          commit-message: 'docs: preview diagrams for #${{ github.event.pull_request.number }}'

      # Deploying an empty directory with the default `clean` empties it.
      - name: Create empty directory
        if: github.event.action == 'closed'
        run: mkdir -p "$RUNNER_TEMP/empty"

      - name: Remove preview
        if: github.event.action == 'closed'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: ${{ runner.temp }}/empty
          target-folder: ${{ env.PREVIEW_DIR }}
          commit-message: 'docs: remove diagrams preview for #${{ github.event.pull_request.number }}'

      - name: Write comment
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$ACTION" = closed ]; then
            echo "Diagrams preview removed." > "$RUNNER_TEMP/comment.md"
            exit 0
          fi
          base=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)
          cat > "$RUNNER_TEMP/comment.md" <<MD
          Diagrams preview: ${base%/}/$PREVIEW_DIR/

          <sub>Built from $SHA. GitHub Pages can take a minute to update.</sub>
          MD

      - name: Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: diagrams-preview
          path: ${{ runner.temp }}/comment.md
