name: Docs Preview

# Builds the Starlight docs site of a PR, with its diagrams, under
# /pr/<number>/, so a broken link fails the check. For same-repo PRs it also publishes the build to
# gh-pages:/pr/<number>/ and keeps one PR comment pointing at it. Docs Pages
# removes the preview in its next deploy once the PR is closed.

on:
  pull_request:
    types: [ opened, reopened, synchronize ]
    paths:
      - 'docs/**'
      - 'diagrams/**'
      - '.github/workflows/docs-preview.yml'

permissions:
  contents: write
  pages: read
  pull-requests: write

# A newer push to the PR replaces its running preview. Other workflows push
# to gh-pages concurrently; the deploy action rebases and retries instead
# (force: false).
concurrency:
  group: docs-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PREVIEW_DIR: pr/${{ github.event.pull_request.number }}
  # Fork PRs get a read-only token and cannot push to gh-pages or comment, so
  # they only build.
  SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: |
            docs/pnpm-lock.yaml
            diagrams/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: docs

      # Also installs and builds diagrams/ into docs/public/diagrams/.
      - name: Build
        run: pnpm run build
        working-directory: docs
        env:
          DOCS_BASE: /${{ env.PREVIEW_DIR }}/

      # .nojekyll only matters at the gh-pages root. The deploy action never
      # deletes it, so a preview carrying it could not be removed.
      - name: Drop root-only files
        run: rm -f docs/dist/.nojekyll

      - name: Deploy preview
        if: env.SAME_REPO == 'true'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: docs/dist
          target-folder: ${{ env.PREVIEW_DIR }}
          commit-message: 'docs: preview docs for #${{ github.event.pull_request.number }}'
          force: false
          attempt-limit: 10

      - name: Write comment
        if: env.SAME_REPO == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)
          cat > "$RUNNER_TEMP/comment.md" <<MD
          Docs preview: ${base%/}/$PREVIEW_DIR/

          <sub>Built from $SHA. GitHub Pages can take a minute to update.</sub>
          MD

      - name: Comment
        if: env.SAME_REPO == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: docs-preview
          path: ${{ runner.temp }}/comment.md
