name: Docs Preview

# Builds the Starlight docs site of a PR under /pr/<number>/, so a broken link
# fails the check. For same-repo PRs it also publishes the build to
# gh-pages:/pr/<number>/, keeps one PR comment pointing at it, and removes it
# when the PR closes.

on:
  pull_request:
    types: [ opened, reopened, synchronize, closed ]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-preview.yml'

permissions:
  contents: write
  pages: read
  pull-requests: write

# Shared by every workflow that pushes to gh-pages.
concurrency:
  group: gh-pages
  cancel-in-progress: false

env:
  PREVIEW_DIR: pr/${{ github.event.pull_request.number }}
  # Fork PRs get a read-only token and cannot push to gh-pages or comment, so
  # they only build.
  SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  preview:
    # A fork PR has no preview to remove.
    if: github.event.action != 'closed' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        if: github.event.action != 'closed'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.0

      - name: Set up Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: pnpm install --frozen-lockfile
        working-directory: docs

      - name: Build
        if: github.event.action != 'closed'
        run: pnpm run build
        working-directory: docs
        env:
          DOCS_BASE: /${{ env.PREVIEW_DIR }}/

      # .nojekyll only matters at the gh-pages root. The deploy action never
      # deletes it, so a preview carrying it could not be removed.
      - name: Drop root-only files
        if: github.event.action != 'closed'
        run: rm -f docs/dist/.nojekyll

      - name: Deploy preview
        if: github.event.action != 'closed' && env.SAME_REPO == 'true'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: docs/dist
          target-folder: ${{ env.PREVIEW_DIR }}
          commit-message: 'docs: preview docs for #${{ github.event.pull_request.number }}'

      # Deploying an empty directory with the default `clean` empties it.
      - name: Create empty directory
        if: github.event.action == 'closed'
        run: mkdir -p "$RUNNER_TEMP/empty"

      - name: Remove preview
        if: github.event.action == 'closed'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: ${{ runner.temp }}/empty
          target-folder: ${{ env.PREVIEW_DIR }}
          commit-message: 'docs: remove docs preview for #${{ github.event.pull_request.number }}'

      - name: Write comment
        if: env.SAME_REPO == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$ACTION" = closed ]; then
            echo "Docs preview removed." > "$RUNNER_TEMP/comment.md"
            exit 0
          fi
          base=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)
          cat > "$RUNNER_TEMP/comment.md" <<MD
          Docs preview: ${base%/}/$PREVIEW_DIR/

          <sub>Built from $SHA. GitHub Pages can take a minute to update.</sub>
          MD

      - name: Comment
        if: env.SAME_REPO == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: docs-preview
          path: ${{ runner.temp }}/comment.md
