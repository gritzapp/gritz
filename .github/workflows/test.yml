name: Tests

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - '.release-please-manifest.json'
      - 'images/**'
      - 'n8n-node/**'
      - 'webui/**'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - '.release-please-manifest.json'
      - 'images/**'
      - 'n8n-node/**'
      - 'webui/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Started in the background so its startup overlaps the Go setup; the
      # wait before the migrations step blocks until it accepts connections.
      # Throwaway DB, so it runs on tmpfs with durability off.
      - name: Start Postgres
        run: |
          docker run -d --name postgres \
            -e POSTGRES_USER=gritz \
            -e POSTGRES_PASSWORD=gritz \
            -e POSTGRES_DB=gritz \
            -p 5432:5432 \
            --tmpfs /var/lib/postgresql \
            postgres:18-alpine \
            -c fsync=off -c synchronous_commit=off

      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Create placeholder index.html for go:embed
        run: mkdir -p internal/server/webui && echo '<!DOCTYPE html><html><body>placeholder</body></html>' > internal/server/webui/index.html

      - name: Download dependencies
        run: go mod download

      - name: Build prebuilt binaries for runner tests
        run: |
          mkdir -p prebuilt
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o prebuilt/gritz-linux-amd64 ./cmd/gritz

      # Over TCP: during initdb the entrypoint's temporary server only listens
      # on the unix socket, so this succeeds only once the real server is up.
      - name: Wait for Postgres
        run: |
          for _ in $(seq 60); do
            docker exec postgres pg_isready -q -h 127.0.0.1 -U gritz && exit 0
            sleep 0.5
          done
          docker logs postgres
          exit 1

      - name: Run migrations
        env:
          DATABASE_URL: postgres://gritz:gritz@localhost:5432/gritz?sslmode=disable
        run: go run ./cmd/migrate

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgres://gritz:gritz@localhost:5432/gritz?sslmode=disable
        run: go tool gotestsum --format github-actions -- -v ./...
