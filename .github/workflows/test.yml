name: Tests

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'diagrams/**'
      - '.release-please-manifest.json'
      - 'images/**'
      - 'n8n-node/**'
      - 'webui/**'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'diagrams/**'
      - '.release-please-manifest.json'
      - 'images/**'
      - 'n8n-node/**'
      - 'webui/**'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: gritz
          POSTGRES_PASSWORD: gritz
          POSTGRES_DB: gritz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gritz"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s
    steps:
      # Service containers can't take a command, so turn off durability once
      # Postgres is up: test data is disposable, and its flushes otherwise slow
      # the Docker backend tests' container creates.
      - name: Disable Postgres durability
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U gritz -d gritz -v ON_ERROR_STOP=1 \
            -c 'ALTER SYSTEM SET fsync = off' \
            -c 'ALTER SYSTEM SET synchronous_commit = off' \
            -c 'ALTER SYSTEM SET full_page_writes = off' \
            -c 'SELECT pg_reload_conf()'

      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          # Key the cache on this file too, so the test and lint jobs don't share
          # (and race to save) one setup-go cache.
          cache-dependency-path: |
            go.sum
            .github/workflows/test.yml

      - name: Create placeholder index.html for go:embed
        run: mkdir -p internal/server/webui && echo '<!DOCTYPE html><html><body>placeholder</body></html>' > internal/server/webui/index.html

      - name: Download dependencies
        run: go mod download

      - name: Build prebuilt binaries for runner tests
        run: |
          mkdir -p prebuilt
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o prebuilt/gritz-linux-amd64 ./cmd/gritz

      - name: Run migrations
        env:
          DATABASE_URL: postgres://gritz:gritz@localhost:5432/gritz?sslmode=disable
        run: go run ./cmd/migrate

      # On master, -count=1 bypasses the test cache so every test runs: cached
      # results can hide flaky tests until an unrelated change invalidates them.
      - name: Run tests
        env:
          TEST_DATABASE_URL: postgres://gritz:gritz@localhost:5432/gritz?sslmode=disable
          TEST_FLAGS: ${{ github.event_name == 'push' && '-count=1' || '' }}
        run: go tool gotestsum --format github-actions -- -v $TEST_FLAGS ./...
