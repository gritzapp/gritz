name: Deploy

# Triggered by the Release workflow rather than by the tag push directly: the
# deploy pulls a published image, so it has to run after the docker job has
# pushed it. The check job below is what restricts this to tagged commits.
on:
  workflow_run:
    workflows: [ Release ]
    types: [ completed ]
    branches: [ master ]

permissions:
  contents: read
  deployments: write

jobs:
  check:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true
      - id: tag
        run: |
          tag=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then
            echo "::notice::No tag at ${GITHUB_SHA}, skipping deploy"
          else
            echo "::notice::Deploying $tag"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: bobheadxi/deployments@v1
        id: deployment
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: production
          ref: ${{ needs.check.outputs.tag }}
          desc: Deploying ${{ needs.check.outputs.tag }} to the dokku host
          auto_inactive: false

      - name: Configure ssh
        env:
          DOKKU_SSH_KEY: ${{ secrets.DOKKU_SSH_KEY }}
          DOKKU_KNOWN_HOSTS: ${{ secrets.DOKKU_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DOKKU_SSH_KEY" >~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DOKKU_KNOWN_HOSTS" >~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to dokku
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          ssh dokku@gritz.dev git:from-image gritz \
            "ghcr.io/gritzapp/gritz-server:${TAG#v}"

      - uses: bobheadxi/deployments@v1
        if: always()
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}
          env: ${{ steps.deployment.outputs.env }}
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
          env_url: https://gritz.dev
