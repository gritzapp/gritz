name: Docs Pages

# Publishes the Starlight docs site in docs/, with the Motion Canvas diagrams in
# diagrams/ built into its /diagrams/, to the root of the gh-pages branch,
# served at docs.gritz.dev. In the same commit it removes the docs preview
# under /pr/<number>/ of every PR that is no longer open. gh-pages holds a
# single orphan commit with no history (.github/scripts/deploy-gh-pages.sh).

on:
  push:
    branches: [ master ]
    paths:
      - 'docs/**'
      - 'diagrams/**'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

# Docs Preview pushes to gh-pages concurrently; the deploy script retries on
# top of the other push instead of overwriting it.
concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: |
            docs/pnpm-lock.yaml
            diagrams/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: docs

      # Also installs and builds diagrams/ into docs/public/diagrams/.
      - name: Build
        run: pnpm run build
        working-directory: docs

      - name: Deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep the previews of open PRs.
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 \
            --json number --jq '.[].number')
          .github/scripts/deploy-gh-pages.sh root docs/dist \
            'docs: publish docs for ${{ github.sha }}' $prs
