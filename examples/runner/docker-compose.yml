services:
  registry:
    image: registry:2
    environment:
      REGISTRY_PROXY_REMOTEURL: https://registry-1.docker.io
    volumes:
      - registry_data:/var/lib/registry

  runner:
    image: ghcr.io/gritzapp/gritz-runner:latest
    env_file: .env
    environment:
      GRITZ_SERVER: https://gritz.dev
      # Create an API key at https://gritz.dev/ui/keys
      GRITZ_API_KEY: ${GRITZ_API_KEY}
      GRITZ_CONFIG_DIR: /etc/gritz
      GRITZ_RUNNER_ID: example-runner
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config:/etc/gritz
      - /tmp/gritz:/tmp/gritz
    depends_on:
      - registry

volumes:
  registry_data:
