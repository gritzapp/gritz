workspaces:
  dummy:
    description: Dummy workspace for exercising the local dev stack
    secrets:
      MY_PASSWORD: "password"
    commands:
      - "echo \"Password: ${MY_PASSWORD}\""
    container:
      image: alpine:3.21
      # Join the dev compose network so the task container can reach the
      # server by its service name (see docker-compose.dev.yml).
      networks:
        - gritz-dev
    agent:
      type: dummy
      dummy:
        # Call the `report` tool on the injected `gritz` agent MCP so the
        # message shows up in the Web UI — exercises the agent MCP end-to-end.
        tool_calls:
          - server: gritz
            name: report
            arguments:
              message: hello from the dummy agent
        sleep: 2
  dummy-error:
    description: Dummy workspace whose agent errors out — exercises failure handling
    container:
      image: alpine:3.21
      # Join the dev compose network so the task container can reach the
      # server by its service name (see docker-compose.dev.yml).
      networks:
        - gritz-dev
    agent:
      type: dummy
      dummy:
        # Return an error so the agent reports a failure.
        error: dummy agent failed on purpose
  dummy-variables:
    description: Dummy workspace with task variables — exercises setting them on a task
    variables:
      JIRA_ISSUE:
        description: The Jira issue the task is for
        required: true
      BRANCH:
        description: Branch to check out
        default: main
      LABEL:
        description: An optional label
    commands:
      - "env | grep '^GRITZ_VAR_' | sort"
    container:
      image: alpine:3.21
      # Join the dev compose network so the task container can reach the
      # server by its service name (see docker-compose.dev.yml).
      networks:
        - gritz-dev
    agent:
      type: dummy
      dummy:
        sleep: 2
  dummy-features:
    description: Dummy workspace with features — exercises selecting them on an agent
    commands:
      - "echo base"
    container:
      image: alpine:3.21
      # Join the dev compose network so the task container can reach the
      # server by its service name (see docker-compose.dev.yml).
      networks:
        - gritz-dev
    agent:
      type: dummy
      dummy:
        sleep: 2
    features:
      greeting:
        description: Sets GREETING and echoes it
        environment:
          GREETING: hello
        commands:
          - "echo \"Greeting: ${GREETING}\""
      token:
        description: Adds a masked secret
        secrets:
          FEATURE_TOKEN: "feature-secret"
        commands:
          - "echo \"Token: ${FEATURE_TOKEN}\""
