[settings]
pin=true

[env]
# The dokku host. Override to target a different droplet.
GRITZ_HOST = "gritz.dev"

[tools]
node = "25.9.0"
go = "1.26.5"
sops = "3.13.2"
age = "1.3.2"
"npm:pnpm" = "11.11.0"
doctl = "1.167.0"
dbmate = "2.33.0"
"aqua:siderolabs/conform" = "0.1.0-alpha.31"
"aqua:golangci/golangci-lint" = "2.12.2"

[tasks.build]
description = "Build gritz binaries for all architectures"
depends = ["build:webui"]
run = [
	"CGO_ENABLED=0 go build -o gritz ./cmd/gritz",
	"mkdir -p prebuilt",
	"CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o prebuilt/gritz-linux-amd64 ./cmd/gritz",
	"CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o prebuilt/gritz-linux-arm64 ./cmd/gritz",
]

[tasks."build:webui"]
description = "Build the web UI (skipped if nothing changed)"
sources = [
	"webui/src/**/*",
	"webui/public/**/*",
	"webui/index.html",
	"webui/package.json",
	"webui/pnpm-lock.yaml",
	"webui/vite.config.ts",
	"webui/tsconfig*.json",
	"webui/components.json",
]
outputs = ["internal/server/webui/index.html"]
run = "cd webui && pnpm install --frozen-lockfile && pnpm exec vite build"

[tasks.dev]
description = "Start a local server + runner in Docker"
depends = ["build:webui"]
run = [
	"CGO_ENABLED=0 GOOS=linux go build -o gritz ./cmd/gritz",
	"docker compose -f docker-compose.dev.yml up --build",
]

[tasks."dev:webui"]
description = "Start docker dev server (detached) and the vite dev server"
depends = ["build:webui"]
run = "cd webui && pnpm install --frozen-lockfile && pnpm dev"

[tasks.install]
description = "Build and install gritz bin"
run = [
	"cd webui && pnpm install --frozen-lockfile && pnpm exec vite build",
	"CGO_ENABLED=0 go build -o $(go env GOPATH)/bin/gritz ./cmd/gritz",
]

[tasks.generate]
description = "Generate code from proto files and sqlc"
run = [
	"go generate ./...",
	"cd webui && pnpm install --frozen-lockfile && pnpm run generate",
]

[tasks."up:test"]
description = "Start postgres via docker compose"
run = "docker compose -f docker-compose.test.yml up -d --wait postgres"

[tasks.migrate]
description = "Run database migrations"
env = { DATABASE_URL = "postgres://gritz:gritz@localhost:5433/gritz?sslmode=disable" }
run = "go run ./cmd/migrate"

[tasks.dbmate]
description = "Run dbmate CLI against the local database (for experiments)"
env = { DATABASE_URL = "postgres://gritz:gritz@localhost:5433/gritz?sslmode=disable", DBMATE_MIGRATIONS_DIR = "internal/store/sql/migrations", DBMATE_SCHEMA_FILE = "internal/store/sql/schema.sql" }
run = "dbmate"

[tasks.test]
description = "Run tests"
depends = ["migrate"]
env = { TEST_DATABASE_URL = "postgres://gritz:gritz@localhost:5433/gritz?sslmode=disable" }
run = "go test ./..."

[tasks.lint]
description = "Run golangci-lint"
depends = ["build:webui"]
run = "golangci-lint run"

[tasks."droplet:create"]
description = "Create the DigitalOcean droplet running dokku (see deploy/README.md)"
env = { DROPLET_NAME = "gritz", DROPLET_REGION = "tor1", DROPLET_SIZE = "s-2vcpu-4gb", DROPLET_IMAGE = "ubuntu-24-04-x64" }
run = """
: "${DROPLET_SSH_KEYS:?set to a comma-separated list of fingerprints from: doctl compute ssh-key list}"
doctl compute droplet create "$DROPLET_NAME" \
	--region "$DROPLET_REGION" \
	--size "$DROPLET_SIZE" \
	--image "$DROPLET_IMAGE" \
	--ssh-keys "$DROPLET_SSH_KEYS" \
	--user-data-file deploy/cloud-init.yaml \
	--enable-monitoring \
	--wait
"""

[tasks.deploy]
description = "Deploy a released image to the dokku host"
run = '''
: "${VERSION:?set VERSION to a released tag, e.g. VERSION=3.0.0}"
ssh "root@$GRITZ_HOST" dokku git:from-image gritz "ghcr.io/icholy/gritz-server:$VERSION"
'''

# The default sops dotenv output format doesn't handle newlines correctly
# See: https://github.com/getsops/sops/issues/1435
[tasks.env]
description = "Decrypt secrets.yml to .env"
run = "sops --output-type json -d sops.env.yml | jq -r 'to_entries[] | \"\\(.key)=\\(.value | tostring | tojson)\"' > .env"

# GRITZ_DATABASE_URL is excluded on purpose: dokku postgres:link owns it and
# points at the service on the droplet, so importing the copy here would send
# the host at whatever this file happens to hold. --encoded is what lets the
# multi-line GRITZ_GITHUB_APP_PRIVATE_KEY survive as a single argument.
[tasks.update_secrets]
description = "Push secrets from sops to the dokku host"
run = '''
sops --output-type json -d sops.env.yml \
  | jq -r 'del(.GRITZ_DATABASE_URL) | to_entries[] | "\(.key)=\(.value | tostring | @base64)"' \
  | xargs ssh "root@$GRITZ_HOST" dokku config:set --encoded gritz
'''

[tasks.psql]
description = "Connect to the local database"
run = "psql postgres://gritz:gritz@localhost:5433/gritz?sslmode=disable"

[tasks.logs]
description = "Tail production logs"
run = 'ssh "root@$GRITZ_HOST" dokku logs gritz -t'

# Bare `mise run ssh` opens a shell; extra args are appended, so
# `mise run ssh -- dokku ps:report gritz` runs that remotely instead.
[tasks.ssh]
description = "SSH into the dokku host"
run = 'ssh "root@$GRITZ_HOST"'

[tasks.diagrams]
description = "Render d2 diagrams to images/"
run = [
	"d2 images/schema.d2",
	"d2 images/architecture.d2",
]

[tasks.localhost_run]
description = "Use localhost.run to expose the vite proxy to the web"
run = "ssh -R 80:localhost:5173 nokey@localhost.run"

[tasks."install:hooks"]
description = "Install git hooks (commit-msg via conform)"
run = "git config core.hooksPath .githooks"
