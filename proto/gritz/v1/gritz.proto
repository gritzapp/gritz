// RuleCondition constrains one attribute of an event. Comparisons are exact and
// case-sensitive. A "glob" value is a pattern matched against the whole
// attribute: "*" and "?" match within a path segment (not "/"), "**" as a whole
// segment matches any number of segments, "[a-z]" matches a character class and
// "{a,b}" either alternative.
message RuleCondition {
  string attr = 1;
  string op = 2;  // One of "equals", "prefix", "contains" or "glob".
  string value = 3;
}

// AttrDef is an event attribute a trigger can have a condition on.
message AttrDef {
  string key = 1;  // The name a RuleCondition's attr refers to.
  string label = 2;        // The attribute's name in the trigger editor.
  string help = 3;         // Help text for the attribute in the trigger editor.
  string placeholder = 4;  // Placeholder for the attribute's value in the trigger editor.
}

// It mirrors the eventrouter registry entry, exposing only the client-relevant
// fields (the shipped default rules are intentionally omitted).

// EventTypeDef is an event type, identified by its source and type, and every
// attribute a trigger can have a condition on for it.
message EventTypeDef {
  string source = 1;
  string type = 2;
  string label = 3;
  repeated AttrDef attrs = 4;
  // The link types an event of this type's URL can name, such as "github.issue"
  // and "github.pr" for a comment. Each is a link type of the same source; a
  // custom event type may name "custom.url".
  repeated string link_types = 5;
}

// LinkTypeDef is a kind of resource a link can name, such as a GitHub pull
// request.
message LinkTypeDef {
  string name = 1;    // Such as "github.pr".
  string source = 2;  // The event source it belongs to, such as "github".
  string label = 3;
}

message GetEventTypesRequest {}

message GetEventTypesResponse {
  repeated EventTypeDef event_types = 1;
  repeated LinkTypeDef link_types = 2;
}

message GetCustomEventTypesRequest {}

message GetCustomEventTypesResponse {
  repeated EventTypeDef event_types = 1; // every source is "custom"
}

// SetCustomEventTypesRequest replaces the org's custom event types. It fails
// with `invalid_argument` if a type is malformed, and `failed_precondition` if
// an existing agent would no longer be valid with the new types.
message SetCustomEventTypesRequest {
  repeated EventTypeDef event_types = 1;
}

message SetCustomEventTypesResponse {
  repeated EventTypeDef event_types = 1;
}

// TestEventRequest composes an event and routes it through the org's agents,
// as a dry run or for real. Every event is validated against its type: it
// fails with `invalid_argument` for an unknown source or type, a missing or
// non-absolute http(s) url, or an attr the type doesn't declare. An event of a
// built-in source routes as the caller. A custom event routes like one posted
// to the custom event webhook: it has no actor, so only public triggers and
// link kinds admit it.
message TestEventRequest {
  string source = 1;                // The event type's source, such as "github".
  string type = 2;                  // The event type, such as "issue_comment".
  // The event's attribute values, keyed by AttrDef.key. An attr may have
  // several values. "body" and "url" are sent in their own fields, not here.
  map<string, AttrValues> attrs = 3;
  string description = 4;           // Optional description shown on the task's timeline; defaults to the event type's label.
  bool fire = 5;                    // False (the default) for a dry run; true to act on the matches.
  map<string, string> details = 6;  // Stored as the event's ExternalPayload.details.
  string body = 7;                  // The event's text, matched by triggers on the "body" attr.
  string url = 8;                   // The event's resource URL, matched by triggers on the "url" attr and by subscribed links.
}

// AttrValues is the values of one event attribute.
message AttrValues {
  repeated string values = 1;
}

message TestEventResponse {
  reserved 1;  // Previously: matches (per routing rule)
  bool fired = 2;  // Whether the event was acted on.
  // What the event did, or would do, for each of the org's agents it reached,
  // in the order ListAgents returns them.
  repeated TestEventAgent agents = 3;
}

// TestEventAgent is what an event did, or would do, for one agent: the
// agent's trigger that matched, and the agent's tasks the event was delivered
// to. An agent the event did neither for is left out.
message TestEventAgent {
  int64 agent_id = 1;
  // The index of the agent's first trigger that matched, or -1 if none did.
  int32 trigger_index = 2;
  // The unarchived tasks holding a claim the matched trigger yields to. When
  // any are listed, the trigger creates no task.
  repeated int64 yielded_to = 3;
  // The task the matched trigger created; set only when fired, and 0 if it
  // yielded.
  int64 created_task_id = 4;
  // The event the matched trigger added to the task it created; set only when
  // fired.
  int64 created_event_id = 5;
  // The agent's tasks the event was, or would be, delivered to.
  repeated TestEventDelivery deliveries = 6;
}

// TestEventDelivery is a task an event was, or would be, delivered to through
// one of its subscribed links.
message TestEventDelivery {
  int64 task_id = 1;
  string kind = 2;      // The link kind that matched.
  int64 event_id = 3;   // The event added to the task; set only when fired.
}

message CreateGitHubTokenRequest {}

