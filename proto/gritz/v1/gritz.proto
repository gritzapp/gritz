// See docs/src/content/docs/proposals/implemented/agents.md.

// Agent is a task template plus the triggers that create its tasks and the
// kinds of link its tasks may subscribe to. An agent is addressed by its id;
// its name is a label, not unique in the org.
message Agent {
  int64 id = 1;
  string name = 2;
  string workspace = 3;
  string runner = 4;
  string prompt = 5;  // The first instruction of the tasks its triggers and schedules create.
  // The auto-archive delay of its tasks, as in Task.auto_archive.
  google.protobuf.Duration auto_archive = 6;
  // Variables of its tasks, by name, as saved. Each must be declared by the
  // workspace, and every required one set.
  map<string, string> variables = 7;
  // Create tasks of the agent. The first trigger that matches an event wins.
  repeated AgentTrigger triggers = 8;
  repeated AgentLink links = 9;
  // Features of its tasks, by name, in the order they merge: a later one wins
  // over an earlier one. Each must be declared by the workspace.
  repeated string features = 10;
  // Create tasks of the agent on a cron schedule, in this order in the editor.
  repeated AgentSchedule schedules = 11;
}

// AgentSchedule creates a task of its agent each time its cron expression
// matches. The task starts with the agent's prompt.
message AgentSchedule {
  // Set by the server. UpdateAgent keeps the schedule with this id, and its
  // last run; 0 adds a schedule. CreateAgent ignores it.
  int64 id = 1;
  string name = 2;  // The name of every task it creates.
  string cron_expr = 3;
  string timezone = 4;  // IANA name; empty is "UTC".
  bool enabled = 5;
  // Output only; CreateAgent and UpdateAgent ignore them. Saving an agent
  // only moves next_run_at when the schedule's cron_expr, timezone or
  // enabled changed.
  google.protobuf.Timestamp next_run_at = 6;  // Unset when disabled.
  google.protobuf.Timestamp last_run_at = 7;  // Unset when it has never run.
  int64 last_task_id = 8;                     // 0 when it has never run.
}

// AgentTrigger creates a task of its agent when an event matches it.
message AgentTrigger {
  string source = 1;
  string type = 2;
  repeated RuleCondition conditions = 3;  // All must hold.
  // Whether it also matches events from people who aren't members of the org.
  // Custom event triggers must be public: custom events have no actor.
  bool public = 4;
  // Claim names: the trigger creates no task while an unarchived task holds a
  // link with one of these claims on the event's resource.
  repeated string yield_to = 5;
  // A link kind of the same agent whose type the event type declares. The
  // created task gets a subscribed link of that kind to the event's resource.
  string link = 6;
  // Static text the created task gets as an instruction after the agent's
  // prompt. Empty adds none.
  string prompt = 7;
}

// AgentLink is a kind of subscribed link the agent's tasks may create, and the
// events a link of that kind delivers.
message AgentLink {
  string type = 1;   // A link type, such as "github.pr".
  string kind = 2;   // The kind's name, unique in the agent; empty means type.
  string claim = 3;  // Stamped on every link of this kind.
  // The event types a link of this kind delivers, each with the conditions
  // its events must meet. A link of a kind with none delivers no event; it
  // still holds its claim.
  repeated AgentLinkEvent events = 4;
  // Whether it also delivers events from people who aren't members of the org.
  bool public = 5;
}

// AgentLinkEvent is an event type a link kind delivers.
message AgentLinkEvent {
  // An event type of the link type's source that declares the link type.
  string type = 1;
  // Validated as a trigger's conditions on the event type are.
  repeated RuleCondition conditions = 2;  // All must hold.
}

// CreateAgentRequest creates agent in the caller's org. agent.id is ignored.
message CreateAgentRequest {
  Agent agent = 1;
}

message CreateAgentResponse {
  Agent agent = 1;
}

