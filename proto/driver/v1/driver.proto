syntax = "proto3";

package driver.v1;

import "gritz/v1/gritz.proto";

option go_package = "github.com/gritzapp/gritz/internal/proto/driver/v1;driverv1";

// DriverService is served by `gritz driver` inside the sandbox and
// called by the runner. Runs execute in-process, one at a time.
service DriverService {
  // Run is the runner's connection to the driver for one run. The runner
  // sends a RunRequest with the version to start or attach to first, the
  // driver answers Hello, and the runner sends the task's events after the
  // driver's position as TaskEvents. The driver stores them in its event file.
  //
  // The first message is attach-or-start, keyed on its version:
  //   another Run stream already open      -> Unavailable (retry)
  //   record.version > version             -> FailedPrecondition (stale)
  //   record.version == version            -> attach, spec ignored
  //   no record / older version, idle      -> start the run (spec required,
  //                                           NotFound without one)
  //   another version running              -> Aborted (busy)
  // At most one Run stream is open at a time. The stream ends after the run's
  // Idle has been sent. A dropped or closed stream detaches and nothing else:
  // the run keeps going.
  rpc Run(stream RunRequest) returns (stream RunResponse);

  // Stop gracefully stops the run with the given version: cancel the run
  // context with ErrStop (agents and setup commands SIGTERM their process
  // groups); the run reports its terminal event and sends Idle as usual.
  // A no-op if that version is not the active run.
  rpc Stop(StopRequest) returns (StopResponse);
}

// RunSpec carries everything the driver reads from its flags and its
// environment today.
message RunSpec {
  // Passed to setup commands and the agent CLI. Not set on the driver
  // process itself.
  map<string, string> env = 5;
  // Workspace secrets. Added to the run's env and masked in shipped log
  // chunks.
  map<string, string> secrets = 6;
  // Agent config and directories. Provisioned once per sandbox, gated by
  // /gritz/.provisioned, so later runs keep whatever the agent changed in
  // them.
  repeated File files = 7;
  // The task to run. The driver fetches it from server_url.
  int64 task_id = 8;
  // The gritz server the driver reports to.
  string server_url = 9;
  // The task token used to call server_url. Masked in shipped log chunks.
  string token = 10;
}

// File is a file or directory the driver writes into the sandbox.
message File {
  // Absolute path inside the sandbox.
  string path = 1;
  // Contents; ignored for a directory.
  bytes data = 2;
  // Permission bits.
  int64 mode = 3;
  // True for a directory.
  bool dir = 4;
}

message RunRequest {
  reserved 2;
  // The run to start or attach to. Set on the first message only.
  int64 version = 1;
  oneof msg {
    // The task's events, in log order. Never on the first message.
    TaskEvents events = 3;
    // Starts run version if the driver has none. Only on the first message;
    // omitted to attach.
    RunSpec spec = 5;
  }
}

message TaskEvents {
  repeated gritz.v1.Event events = 1;
}

message RunResponse {
  oneof msg {
    KeepAlive keep_alive = 3;
    // First message on every stream.
    Hello hello = 7;
    // Last message of a stream: the run has ended. Sent after its terminal
    // runner event.
    Idle idle = 8;
  }
}

message Hello {
  // Id of the last event the driver has stored; 0 for none.
  int64 last_event_id = 1;
}

// Idle is the last message of a Run stream: the run it opened has ended.
message Idle {
  // Version of the run.
  int64 version = 1;
  // Whether the driver's SubmitRunnerEvents call for the run's terminal event
  // succeeded. False makes the runner report the run failed.
  bool reported = 2;
}

message KeepAlive {}

message StopRequest {
  int64 version = 1;
}

message StopResponse {
  // True if a running run with this version was stopped.
  bool stopped = 1;
}
