workspaces:
  ws:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: token
    container:
      environment:
        CLAUDE_CODE_OAUTH_TOKEN: token
    agent:
      type: claude
      mcp_servers:
        github:
          type: stdio
          command: gritz
          args: [tool, github-mcp]
    features:
      node:
        description: Node.js
        commands:
          - mise use -g node@22
      jira:
        environment:
          JIRA_SITE: gritz.atlassian.net
        secrets:
          JIRA_API_TOKEN: jira-token
        mcp_servers:
          jira:
            type: stdio
            command: jira-mcp
      codex:
        secrets:
          OPENAI_API_KEY: openai-key
        agent:
          type: codex
          mcp_servers:
            github:
              type: stdio
              command: gritz
              args: [tool, github-mcp]
      dummy:
        agent:
          type: dummy
          mcp_servers:
            github:
              type: stdio
              command: gritz
              args: [tool, github-mcp]
