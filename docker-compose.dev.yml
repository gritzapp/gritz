services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: gritz
      POSTGRES_PASSWORD: gritz
      POSTGRES_DB: gritz
      PGPORT: "5433"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - gritz
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gritz -p 5433"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["./gritz", "server", "--no-auth"]
    ports:
      - "6464:6464"
    env_file: .env
    environment:
      GRITZ_BASE_URL: http://localhost:6464
      GRITZ_CORS: "true"
      GRITZ_DATABASE_URL: postgres://gritz:gritz@postgres:5433/gritz?sslmode=disable
    networks:
      - gritz
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Under --no-auth the server injects the fixed dev API key before the HTTP
      # listener starts, so once it answers, the key the runner uses already
      # exists. The runner waits on this healthcheck, so it never races the key.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:6464/ui/"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 3s

  # A local runner that executes tasks on the host Docker daemon. It runs the
  # same static binary as the server (Dockerfile.dev), so the runner injects
  # its own executable as the task driver — no separate prebuilt dir needed.
  runner:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["./gritz", "runner", "--workspaces", "/etc/gritz/workspaces.yml"]
    environment:
      GRITZ_SERVER: http://server:6464
      # Matches the fixed dev key the --no-auth server injects on startup
      # (internal/command/server.go: provisionDevKey).
      GRITZ_API_KEY: xat_dev
      GRITZ_RUNNER_ID: dev-runner
      GRITZ_STATE_DIR: /var/lib/gritz/tasks
    volumes:
      # Spawn task containers on the host daemon.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dev/workspaces.yml:/etc/gritz/workspaces.yml:ro
      - runner_state:/var/lib/gritz
    networks:
      - gritz
    depends_on:
      server:
        condition: service_healthy

networks:
  # A fixed network name so the dummy workspace (dev/workspaces.yml) can attach
  # its task containers to it and reach the server by its "server" service name.
  gritz:
    name: gritz-dev

volumes:
  postgres_data:
  runner_state:
