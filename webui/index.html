<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gritz</title>
    <script>
      // Apply the theme before first paint; useApplyTheme in
      // src/components/theme-toggle.tsx owns it after load. usehooks-ts stores
      // the preference JSON-encoded.
      ;(function () {
        var t = null
        try {
          t = JSON.parse(localStorage.getItem('gritz-theme'))
        } catch (e) {}
        var dark =
          t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
