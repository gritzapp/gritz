services:
  postgres:
    image: postgres:18-alpine
    # Every test opens its own pool, and go test runs packages and their
    # parallel tests at once: on a many-core machine the default 100 runs out.
    command: ["postgres", "-c", "max_connections=1000"]
    environment:
      POSTGRES_USER: gritz
      POSTGRES_PASSWORD: gritz
      POSTGRES_DB: gritz
      PGPORT: "5433"
    network_mode: host
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gritz -p 5433"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
